<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta http-equiv="refresh" content="0; url=./docs/" />
<title>Local Photo Converter</title>
<link rel="canonical" href="./docs/" />
<style>
  :root{--bg:#0a0a0b;--fg:#f4f1ea;--muted:#9b968c;--accent:#e5b567;--line:rgb(255 255 255 / .1)}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased}
  .box{text-align:center;padding:2rem}
  .box p{margin:.4rem 0 1.4rem;color:var(--muted);font-size:.9rem}
  a{display:inline-block;padding:.6rem 1.2rem;border:1px solid var(--line);border-radius:999px;
    color:var(--fg);text-decoration:none;font-size:.9rem;transition:border-color .3s ease,transform .3s ease}
  a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  h1{font-size:1.25rem;font-weight:600;letter-spacing:-.02em;margin:0}
</style>
</head>
<body>
  <div class="box">
    <h1>Local Photo Converter</h1>
    <p>正在前往站点 …</p>
    <a href="./docs/">立即前往 →</a>
  </div>
</body>
</html>
